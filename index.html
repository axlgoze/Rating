<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Raiting app</title>
</head>
<body>
    <div class="rating-card">
        <div class="rating-card__items" role="radiogroup" aria-label="Rating">
            <!-- Rating items will be dynamically added here -->
        </div>
        <div class="rating-card__display">Selected Rating: <span id="selected-rating">None</span></div>
        <button id="submit-rating" class="btn" aria-label="Submit Rating">Submit</button>
        <button id="reset-rating" class="btn" aria-label="Reset Rating">Reset</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
